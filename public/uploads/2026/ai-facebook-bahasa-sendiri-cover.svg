<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a583e"/>
      <stop offset=".55" stop-color="#0b7068"/>
      <stop offset="1" stop-color="#05718d"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd3a0"/>
      <stop offset="1" stop-color="#36b9d6"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0b0f0e"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="10" fill="url(#g)"/>

  <!-- Bot Bob -->
  <g transform="translate(860 170)">
    <rect x="0" y="0" width="96" height="84" rx="22" fill="url(#g)"/>
    <circle cx="32" cy="40" r="9" fill="#ffffff"/><circle cx="64" cy="40" r="9" fill="#ffffff"/>
    <rect x="30" y="60" width="36" height="6" rx="3" fill="#ffffff" fill-opacity=".8"/>
    <line x1="48" y1="0" x2="48" y2="-22" stroke="#3fd3a0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="48" cy="-28" r="7" fill="#3fd3a0"/>
    <text x="48" y="118" fill="#7d8d87" font-family="ui-monospace, Consolas, monospace" font-size="22" text-anchor="middle">Bob</text>
  </g>
  <g transform="translate(990 160)">
    <rect width="470" height="96" rx="24" fill="#16211e" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="28" y="60" fill="#e6f2ee" font-family="ui-monospace, Consolas, monospace" font-size="28">i can i i everything else</text>
  </g>

  <!-- Bot Alice -->
  <g transform="translate(1364 380)">
    <rect x="0" y="0" width="96" height="84" rx="22" fill="#05718d"/>
    <circle cx="32" cy="40" r="9" fill="#ffffff"/><circle cx="64" cy="40" r="9" fill="#ffffff"/>
    <path d="M30 60 Q48 72 66 60" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="48" y1="0" x2="48" y2="-22" stroke="#36b9d6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="48" cy="-28" r="7" fill="#36b9d6"/>
    <text x="48" y="118" fill="#7d8d87" font-family="ui-monospace, Consolas, monospace" font-size="22" text-anchor="middle">Alice</text>
  </g>
  <g transform="translate(820 370)">
    <rect width="520" height="96" rx="24" fill="#0b7068"/>
    <text x="28" y="60" fill="#ffffff" font-family="ui-monospace, Consolas, monospace" font-size="28">to me to me to me to me</text>
  </g>

  <!-- Stempel -->
  <g transform="translate(1010 600) rotate(-6)">
    <rect width="420" height="110" rx="12" fill="none" stroke="#f4a3b8" stroke-width="6"/>
    <text x="210" y="70" fill="#f4a3b8" font-family="ui-monospace, Consolas, monospace" font-size="40" font-weight="700" text-anchor="middle" letter-spacing="4">MITOS?</text>
  </g>

  <!-- Judul -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="800">
    <text x="120" y="330" fill="#ffffff" font-size="84" letter-spacing="-3">AI Facebook</text>
    <text x="120" y="430" fill="#ffffff" font-size="84" letter-spacing="-3">dimatikan</text>
    <text x="120" y="530" fill="url(#t)" font-size="84" letter-spacing="-3">karena bisa</text>
    <text x="120" y="630" fill="url(#t)" font-size="84" letter-spacing="-3">ngobrol?</text>
  </g>
  <text x="122" y="720" fill="#7d8d87" font-family="ui-monospace, Consolas, monospace" font-size="26">FAIR · 2017 · Deal or No Deal</text>
</svg>
