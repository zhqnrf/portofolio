<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a583e"/>
      <stop offset=".55" stop-color="#0b7068"/>
      <stop offset="1" stop-color="#05718d"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd3a0"/>
      <stop offset="1" stop-color="#36b9d6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".2" r=".7">
      <stop offset="0" stop-color="#0b7068" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0b0f0e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0b0f0e"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect y="0" width="1600" height="10" fill="url(#g)"/>

  <!-- Editor window -->
  <g transform="translate(120 150)">
    <rect width="760" height="460" rx="22" fill="#121a18" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="40" cy="38" r="8" fill="#ff5f57"/>
    <circle cx="68" cy="38" r="8" fill="#febc2e"/>
    <circle cx="96" cy="38" r="8" fill="#28c840"/>
    <text x="380" y="44" fill="#6c7a75" font-family="ui-monospace, Consolas, monospace" font-size="18" text-anchor="middle">still_alive.php</text>
    <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="27">
      <text x="44" y="120" fill="#36b9d6">&lt;?php</text>
      <text x="44" y="185" fill="#6c7a75">// 1995 → hari ini</text>
      <text x="44" y="245"><tspan fill="#3fd3a0">enum</tspan><tspan fill="#e6f2ee"> Status: string</tspan></text>
      <text x="44" y="300"><tspan fill="#e6f2ee">{ </tspan><tspan fill="#3fd3a0">case</tspan><tspan fill="#e6f2ee"> Hidup = </tspan><tspan fill="#f4c98a">'hidup'</tspan><tspan fill="#e6f2ee">; }</tspan></text>
      <text x="44" y="370"><tspan fill="#3fd3a0">echo</tspan><tspan fill="#e6f2ee"> Status::Hidup-&gt;value;</tspan></text>
      <text x="44" y="420" fill="#6c7a75">// hidup</text>
    </g>
  </g>

  <!-- Headline -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="800">
    <text x="960" y="330" fill="#ffffff" font-size="88" letter-spacing="-3">PHP katanya</text>
    <text x="960" y="430" fill="#ffffff" font-size="88" letter-spacing="-3">mau mati.</text>
    <text x="960" y="545" fill="url(#t)" font-size="88" letter-spacing="-3">Kok masih</text>
    <text x="960" y="645" fill="url(#t)" font-size="88" letter-spacing="-3">ada?</text>
  </g>

  <!-- Version timeline -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="20" fill="#6c7a75">
    <line x1="120" y1="760" x2="1480" y2="760" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <line x1="120" y1="760" x2="1480" y2="760" stroke="url(#t)" stroke-width="2" stroke-dasharray="4 10"/>
    <g>
      <circle cx="120" cy="760" r="7" fill="#3fd3a0"/><text x="120" y="805" text-anchor="middle">1995</text>
      <circle cx="420" cy="760" r="7" fill="#3fd3a0"/><text x="420" y="805" text-anchor="middle">PHP 5 · 2004</text>
      <circle cx="760" cy="760" r="7" fill="#36b9d6"/><text x="760" y="805" text-anchor="middle">PHP 7 · 2015</text>
      <circle cx="1100" cy="760" r="7" fill="#36b9d6"/><text x="1100" y="805" text-anchor="middle">PHP 8 · 2020</text>
      <circle cx="1480" cy="760" r="9" fill="#ffffff"/><text x="1480" y="805" text-anchor="end" fill="#ffffff">8.5 · 2025</text>
    </g>
  </g>
</svg>
