<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a583e"/>
      <stop offset=".55" stop-color="#0b7068"/>
      <stop offset="1" stop-color="#05718d"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd3a0"/>
      <stop offset="1" stop-color="#36b9d6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0b0f0e"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="10" fill="url(#g)"/>

  <!-- Tumpukan file model -->
  <g transform="translate(930 190)" font-family="ui-monospace, Consolas, monospace">
    <g transform="translate(60 0)">
      <rect width="420" height="96" rx="16" fill="#16211e" stroke="#ffffff" stroke-opacity=".08"/>
      <rect x="22" y="24" width="48" height="48" rx="10" fill="url(#g)"/>
      <text x="92" y="58" fill="#e6f2ee" font-size="26">model.safetensors</text>
      <circle cx="388" cy="48" r="14" fill="#3fd3a0"/>
      <path d="M381 48 l5 5 l9 -10" fill="none" stroke="#0b0f0e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(0 130)">
      <rect width="480" height="96" rx="16" fill="#2a1418" stroke="#f4a3b8" stroke-opacity=".6" stroke-width="2"/>
      <rect x="22" y="24" width="48" height="48" rx="10" fill="#f4a3b8"/>
      <text x="46" y="58" fill="#2a1418" font-size="30" font-weight="700" text-anchor="middle">!</text>
      <text x="92" y="58" fill="#f4c2cf" font-size="26">pytorch_model.bin</text>
      <text x="392" y="58" fill="#f4a3b8" font-size="20">pickle</text>
    </g>
    <g transform="translate(60 260)">
      <rect width="420" height="96" rx="16" fill="#16211e" stroke="#ffffff" stroke-opacity=".08"/>
      <rect x="22" y="24" width="48" height="48" rx="10" fill="#05718d"/>
      <text x="92" y="58" fill="#e6f2ee" font-size="26">HF_TOKEN=hf_••••</text>
      <text x="388" y="58" fill="#f4a3b8" font-size="26" text-anchor="middle">⚠</text>
    </g>
  </g>

  <!-- Gembok terbuka -->
  <g transform="translate(1400 640)" fill="none" stroke="url(#t)" stroke-width="12" stroke-linecap="round">
    <rect x="-70" y="0" width="140" height="110" rx="20" fill="#0b0f0e"/>
    <path d="M-40 0 V-40 A40 40 0 0 1 40 -40 V-70"/>
    <circle cx="0" cy="50" r="10" fill="url(#t)" stroke="none"/>
  </g>

  <!-- Judul -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="800">
    <text x="120" y="320" fill="#ffffff" font-size="84" letter-spacing="-3">Gudang model AI</text>
    <text x="120" y="420" fill="#ffffff" font-size="84" letter-spacing="-3">kebobolan.</text>
    <text x="120" y="520" fill="url(#t)" font-size="84" letter-spacing="-3">Apa yang bisa</text>
    <text x="120" y="620" fill="url(#t)" font-size="84" letter-spacing="-3">kita pelajari?</text>
  </g>
  <text x="122" y="710" fill="#7d8d87" font-family="ui-monospace, Consolas, monospace" font-size="26">Hugging Face · Spaces · pickle · token</text>
